<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Dapur Tyas">
  <defs>
    <linearGradient id="dtTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2703F"/>
      <stop offset="1" stop-color="#B84E27"/>
    </linearGradient>
    <linearGradient id="dtGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6B25C"/>
      <stop offset="1" stop-color="#C99532"/>
    </linearGradient>
  </defs>

  <!-- Outer tile -->
  <circle cx="256" cy="256" r="250" fill="url(#dtTile)"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Inner cream disc -->
  <circle cx="256" cy="256" r="196" fill="#FFF8F1"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FFFFFF" stroke-width="12"/>

  <!-- Steam curls -->
  <path d="M200 186 C 186 168 200 152 194 134" fill="none" stroke="url(#dtGold)" stroke-width="16" stroke-linecap="round"/>
  <path d="M312 186 C 326 168 312 152 318 134" fill="none" stroke="url(#dtGold)" stroke-width="16" stroke-linecap="round"/>
  <path d="M256 186 C 252 172 258 160 256 148" fill="none" stroke="url(#dtGold)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- Lid -->
  <rect x="182" y="220" width="148" height="50" rx="25" fill="url(#dtGold)"/>
  <circle cx="256" cy="210" r="16" fill="#FFF8F1" stroke="#C99532" stroke-width="7"/>

  <!-- Pot body -->
  <path d="M168 262 L344 262 A 14 14 0 0 1 358 276 L 350 322 A 26 26 0 0 1 324 348 L 188 348 A 26 26 0 0 1 162 322 L 154 276 A 14 14 0 0 1 168 262 Z" fill="#C85A32"/>
  <!-- Pot shine -->
  <path d="M184 280 L224 280 L214 334 L194 334 Z" fill="#FFFFFF" opacity="0.18"/>

  <!-- Serving handles -->
  <circle cx="150" cy="268" r="16" fill="none" stroke="#C85A32" stroke-width="12"/>
  <circle cx="362" cy="268" r="16" fill="none" stroke="#C85A32" stroke-width="12"/>

  <!-- Flame -->
  <path d="M256 404 C 234 378 222 362 224 338 C 226 315 244 306 256 296 C 268 306 286 315 288 338 C 290 362 278 378 256 404 Z" fill="url(#dtGold)"/>
  <path d="M256 396 C 243 380 236 368 238 352 C 240 338 248 332 256 326 C 264 332 272 338 274 352 C 276 368 269 380 256 396 Z" fill="none" stroke="#FFF8F1" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
</svg>